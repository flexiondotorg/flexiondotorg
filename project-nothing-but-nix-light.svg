<g>
  <rect x="340" y="22" width="48" height="22" rx="11" fill="#ccd0da" stroke="#bcc0cc" stroke-width="1"/>
  <text x="364" y="36.5" text-anchor="middle" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#4c4f69">v12</text>
</g>

<!-- Project title and wrapped 4-line description -->
<text x="100" y="42" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.2" fill="#4c4f69">Nothing But Nix</text>
<text x="100" y="68" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">Create a Nix ️store of up to 129GiB in GitHub</text><text x="100" y="86" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">runners ❄️ Multi-disk BTRFS pool for /nix 💪</text><text x="100" y="104" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">Brutally purges unnecessary software 🪓</text><text x="100" y="122" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">Dynamically grows the Nix store 📈</text>

<!-- Clean 1px Surface0 footer separator -->
<line x1="20" y1="142" x2="388" y2="142" stroke="#ccd0da" stroke-width="1"/>

<!-- Clean 3-part footer: language, stars, release age -->
<g>
  <circle cx="24" cy="159" r="4" fill="#7e7bae"/><text x="35" y="163" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4c4f69">Nix</text>
  <text x="204" y="163" text-anchor="middle" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#4c4f69"><tspan fill="#df8e1d">★</tspan> 259</text>
  <text x="388" y="163" text-anchor="end" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#9ca0b0">3w ago</text>
