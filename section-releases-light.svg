<svg xmlns="http://www.w3.org/2000/svg" width="840" height="42" viewBox="0 0 840 42" role="img" aria-label="RECENT RELEASES">
<defs>
  <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#eff1f5"/>
    <stop offset="100%" stop-color="#e6e9ef"/>
  </linearGradient>
  <linearGradient id="cat-accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="100%" stop-color="#179299"/>
  </linearGradient>
  <linearGradient id="cat-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ea76cb"/>
    <stop offset="25%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="75%" stop-color="#179299"/>
    <stop offset="100%" stop-color="#40a02b"/>
  </linearGradient>
  <linearGradient id="cat-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="32%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65"/>
    <stop offset="68%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cat-glint" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef" stop-opacity="0"/>
    <stop offset="28%" stop-color="#8839ef" stop-opacity="0.88"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.96"/>
    <stop offset="72%" stop-color="#179299" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#179299" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  @keyframes vitrine-divider-dot-pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.65; }
    50% { transform: scale(1.18); opacity: 1; }
  }
  .vitrine-divider-dot-left,
  .vitrine-divider-dot-right {
    transform-box: fill-box;
    transform-origin: center;
    animation: vitrine-divider-dot-pulse 3.6s ease-in-out infinite;
  }
  .vitrine-divider-dot-right {
    animation-delay: 0.6s;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- Single 1.5px Surface1 section divider banner -->
<rect x="1" y="4" width="838" height="34" rx="10" fill="url(#card-bg)" stroke="#bcc0cc" stroke-width="1.5"/>

<!-- Left static grey rule and AccentPrimary inner circle pip -->
<line x1="28" y1="21" x2="288" y2="21" stroke="#bcc0cc" stroke-width="1" opacity="0.65"/>
<circle cx="22" cy="21" r="3" fill="#179299"/>
<circle class="vitrine-divider-dot-left" cx="302" cy="21" r="3.5" fill="#8839ef"/>

<!-- Centred bold uppercase Work Sans title -->
<text x="420" y="25.5" text-anchor="middle" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.8" fill="#4c4f69">RECENT RELEASES</text>

<!-- Right AccentPrimary inner circle pip and static grey rule -->
<circle class="vitrine-divider-dot-right" cx="538" cy="21" r="3.5" fill="#8839ef"/>
<line x1="552" y1="21" x2="812" y2="21" stroke="#bcc0cc" stroke-width="1" opacity="0.65"/>
<circle cx="818" cy="21" r="3" fill="#179299"/>

</svg>