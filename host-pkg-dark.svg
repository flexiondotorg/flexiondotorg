<svg xmlns="http://www.w3.org/2000/svg" width="198" height="78" viewBox="0 0 198 78" role="img" aria-label="PKG package repository">
<defs>
  <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1e1e2e"/>
    <stop offset="100%" stop-color="#181825"/>
  </linearGradient>
  <linearGradient id="cat-accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#cba6f7"/>
    <stop offset="50%" stop-color="#89b4fa"/>
    <stop offset="100%" stop-color="#94e2d5"/>
  </linearGradient>
  <linearGradient id="cat-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f5c2e7"/>
    <stop offset="25%" stop-color="#cba6f7"/>
    <stop offset="50%" stop-color="#89b4fa"/>
    <stop offset="75%" stop-color="#94e2d5"/>
    <stop offset="100%" stop-color="#a6e3a1"/>
  </linearGradient>
  <linearGradient id="cat-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="32%" stop-color="#cba6f7" stop-opacity="0.14"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.34"/>
    <stop offset="68%" stop-color="#cba6f7" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cat-glint" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
    <stop offset="28%" stop-color="#cba6f7" stop-opacity="0.88"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.96"/>
    <stop offset="72%" stop-color="#94e2d5" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="host-clip">
    <rect x="1.75" y="1.75" width="194.5" height="74.5" rx="9.25"/>
  </clipPath>
</defs>
<style>
  @keyframes vitrine-host-glint {
    0% { transform: translateX(-90px); opacity: 0; }
    10% { opacity: 1; }
    55% { transform: translateX(220px); opacity: 1; }
    66%, 100% { transform: translateX(220px); opacity: 0; }
  }
  .vitrine-host-glint {
    animation: vitrine-host-glint 6.5s ease-in-out 0.90s infinite;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- Single 1.5px Surface1 outer border -->
<rect x="1" y="1" width="196" height="76" rx="10" fill="url(#card-bg)" stroke="#45475a" stroke-width="1.5"/>

<!-- Clipped slim 2.5px Catppuccin top bar with staggered top-edge glint -->
<g clip-path="url(#host-clip)">
  <rect x="0" y="1" width="198" height="3.25" fill="url(#cat-accent)"/>
  <rect x="0" y="1.75" width="76" height="2.5" rx="1.25" fill="url(#cat-glint)" class="vitrine-host-glint"/>
</g>

<!-- Unframed 40x40 host logo -->
<svg x="14" y="20" width="40" height="40" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet"><title>Arch Linux</title><style>path{fill:#1793D1}@media (prefers-color-scheme:dark){path{fill:#1793D1}}</style><path d="M11.39.605C10.376 3.092 9.764 4.72 8.635 7.132c.693.734 1.543 1.589 2.923 2.554-1.484-.61-2.496-1.224-3.252-1.86C6.86 10.842 4.596 15.138 0 23.395c3.612-2.085 6.412-3.37 9.021-3.862a6.61 6.61 0 01-.171-1.547l.003-.115c.058-2.315 1.261-4.095 2.687-3.973 1.426.12 2.534 2.096 2.478 4.409a6.52 6.52 0 01-.146 1.243c2.58.505 5.352 1.787 8.914 3.844-.702-1.293-1.33-2.459-1.929-3.57-.943-.73-1.926-1.682-3.933-2.713 1.38.359 2.367.772 3.137 1.234-6.09-11.334-6.582-12.84-8.67-17.74z"/></svg>

<!-- Host name, domain subtitle, and Surface0 package count pill -->
<text x="64" y="27" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.6" fill="#cdd6f4">PKG</text>
<text x="64" y="42" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#6c7086">pkg.wimpys.world</text>

<g>
  <rect x="64" y="49" width="60" height="19" rx="9.5" fill="#313244"/>
  <text x="94" y="62" text-anchor="middle" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#cba6f7">12 pkgs</text>
</g>
</svg>