<svg xmlns="http://www.w3.org/2000/svg" width="408" height="182" viewBox="0 0 408 182" role="img" aria-label="Ffmpeg Statigo">
<defs>
  <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#eff1f5"/>
    <stop offset="100%" stop-color="#e6e9ef"/>
  </linearGradient>
  <linearGradient id="cat-accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="100%" stop-color="#179299"/>
  </linearGradient>
  <linearGradient id="cat-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ea76cb"/>
    <stop offset="25%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="75%" stop-color="#179299"/>
    <stop offset="100%" stop-color="#40a02b"/>
  </linearGradient>
  <linearGradient id="cat-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="32%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65"/>
    <stop offset="68%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cat-glint" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef" stop-opacity="0"/>
    <stop offset="28%" stop-color="#8839ef" stop-opacity="0.88"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.96"/>
    <stop offset="72%" stop-color="#179299" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#179299" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card-clip">
    <rect x="1.75" y="1.75" width="404.5" height="178.5" rx="11.25"/>
  </clipPath>
</defs>
<style>
  @keyframes vitrine-fresh-pulse {
    0% { transform: scale(1); opacity: 0.85; }
    75% { transform: scale(2.2); opacity: 0; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  @keyframes vitrine-wave {
    0%, 100% { transform: scaleY(0.45); opacity: 0.72; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  @keyframes vitrine-card-glint {
    0% { transform: translateX(-140px); opacity: 0; }
    10% { opacity: 1; }
    55% { transform: translateX(430px); opacity: 1; }
    66%, 100% { transform: translateX(430px); opacity: 0; }
  }
  .vitrine-fresh-ring {
    transform-box: fill-box;
    transform-origin: center;
    animation: vitrine-fresh-pulse 2.2s ease-out infinite;
  }
  .vitrine-wave-bar {
    transform-box: fill-box;
    transform-origin: center;
    animation: vitrine-wave 1.8s ease-in-out infinite;
  }
  .vitrine-card-glint {
    animation: vitrine-card-glint 6.5s ease-in-out 4.95s infinite;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- Single 1.5px Surface1 outer border -->
<rect x="1" y="1" width="406" height="180" rx="12" fill="url(#card-bg)" stroke="#bcc0cc" stroke-width="1.5"/>

<!-- Clipped slim 2.5px Catppuccin top bar with staggered top-edge glint -->
<g clip-path="url(#card-clip)">
  <rect x="0" y="1" width="408" height="3.25" fill="url(#cat-accent)"/>
  <rect x="0" y="1.75" width="120" height="2.5" rx="1.25" fill="url(#cat-glint)" class="vitrine-card-glint"/>
</g>

<!-- Unframed 64x64 project logo -->
<svg x="20" y="34" width="64" height="64" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="vlogo-524488ad-s6-em-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#10b981"/></linearGradient><linearGradient id="vlogo-524488ad-s6-em-bot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient><linearGradient id="vlogo-524488ad-s6-cy-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#00add8"/></linearGradient><linearGradient id="vlogo-524488ad-s6-cy-bot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00add8"/><stop offset="100%" stop-color="#0369a1"/></linearGradient><linearGradient id="vlogo-524488ad-s6-key" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient></defs><g id="vlogo-524488ad-emblem-rim" fill="#0b151e" stroke="#0b151e" stroke-width="5.2" stroke-linejoin="round"><polygon points="7,12.5 23.5,12.5 37.5,32 23.5,51.5 7,51.5 17,32"/><polygon points="28,12.5 44,12.5 58,32 44,51.5 28,51.5 42,32"/></g><g id="vlogo-524488ad-rear-block"><polygon points="7,12.5 23.5,12.5 37.5,32 17,32" fill="url(#vlogo-524488ad-s6-em-top)"/><polygon points="17,32 37.5,32 23.5,51.5 7,51.5" fill="url(#vlogo-524488ad-s6-em-bot)"/><polygon points="7,12.5 23.5,12.5 22.2,15 8.8,15" fill="#a7f3d0" opacity="0.5"/></g><g id="vlogo-524488ad-front-block"><polygon points="28,12.5 44,12.5 58,32 42,32" fill="url(#vlogo-524488ad-s6-cy-top)"/><polygon points="42,32 58,32 44,51.5 28,51.5" fill="url(#vlogo-524488ad-s6-cy-bot)"/><polygon points="28,12.5 44,12.5 42.8,15 29.8,15" fill="#cffafe" opacity="0.5"/></g><g id="vlogo-524488ad-fusion-lock"><polygon points="31.5,28.5 41.8,28.5 44.5,32 41.8,35.5 31.5,35.5 34.2,32" fill="url(#vlogo-524488ad-s6-key)" stroke="#0b151e" stroke-width="1.6" stroke-linejoin="round"/><polygon points="31.5,28.5 41.8,28.5 44.5,32 34.2,32" fill="#ffffff" opacity="0.35"/></g></svg>

<!-- Top-right release version pill -->
<g>
  <rect x="304" y="22" width="84" height="22" rx="11" fill="#ccd0da" stroke="#40a02b" stroke-width="1"/>
  <circle cx="316" cy="33" r="3.4" fill="#40a02b" opacity="0.45" class="vitrine-fresh-ring"/>
  <circle cx="316" cy="33" r="3.1" fill="#40a02b"/>
  <text x="325" y="36.5" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#4c4f69">v8.1.3.0</text>
</g>

<!-- Project title and wrapped 4-line description -->
<text x="100" y="42" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.2" fill="#4c4f69">Ffmpeg Statigo</text>
<text x="100" y="68" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">Static FFmpeg Go bindings and standalone</text><text x="100" y="86" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">ffmpeg-statigo/ffprobe-statigo CLI binaries</text><text x="100" y="104" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">for Linux, macOS, and Windows</text>

<!-- Clean 1px Surface0 footer separator -->
<line x1="20" y1="142" x2="388" y2="142" stroke="#ccd0da" stroke-width="1"/>

<!-- Clean 3-part footer: language, stars, release age -->
<g>
  <circle cx="24" cy="159" r="4" fill="#8b949e"/><text x="35" y="163" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4c4f69">C</text>
  <text x="204" y="163" text-anchor="middle" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#4c4f69"><tspan fill="#df8e1d">★</tspan> 21</text>
  <text x="388" y="163" text-anchor="end" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#9ca0b0">today</text>
</g>
</svg>