<!-- Left sponsor headline and wrapped sponsor lists -->
<g class="vitrine-sponsors-text">
  <text x="34" y="36" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="-0.15" fill="#4c4f69">Enjoy my work?</text>
