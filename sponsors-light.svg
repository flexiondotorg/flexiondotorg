<svg xmlns="http://www.w3.org/2000/svg" width="840" height="138" viewBox="0 0 840 138" role="img" aria-label="GitHub Sponsors - Sponsor on GitHub">
<defs>
  <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#eff1f5"/>
    <stop offset="100%" stop-color="#e6e9ef"/>
  </linearGradient>
  <linearGradient id="cat-accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="100%" stop-color="#179299"/>
  </linearGradient>
  <linearGradient id="cat-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ea76cb"/>
    <stop offset="25%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="75%" stop-color="#179299"/>
    <stop offset="100%" stop-color="#40a02b"/>
  </linearGradient>
  <linearGradient id="cat-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="32%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65"/>
    <stop offset="68%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cat-glint" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef" stop-opacity="0"/>
    <stop offset="28%" stop-color="#8839ef" stop-opacity="0.88"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.96"/>
    <stop offset="72%" stop-color="#179299" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#179299" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="sponsors-clip">
    <rect x="1.75" y="1.75" width="836.5" height="134.50" rx="11.25"/>
  </clipPath>
  <linearGradient id="sponsors-text-scrim" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#eff1f5" stop-opacity="0.56"/>
    <stop offset="78%" stop-color="#eff1f5" stop-opacity="0.56"/>
    <stop offset="100%" stop-color="#eff1f5" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sponsors-cta-border" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ea76cb"/>
    <stop offset="100%" stop-color="#d20f39"/>
  </linearGradient>
  <linearGradient id="sponsors-cta-fill" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ea76cb" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#d20f39" stop-opacity="0.10"/>
  </linearGradient>
</defs>
<style>
  @keyframes vitrine-heart-rise-a {
    0% { transform: translateY(138px); opacity: 0; }
    10% { opacity: 1; }
    88% { opacity: 1; }
    100% { transform: translateY(-77.28px); opacity: 0; }
  }
  @keyframes vitrine-heart-rise-b {
    0% { transform: translateY(99.36px); opacity: 0; }
    10% { opacity: 1; }
    88% { opacity: 1; }
    100% { transform: translateY(-115.92px); opacity: 0; }
  }
  @keyframes vitrine-heart-rise-c {
    0% { transform: translateY(63.48px); opacity: 0; }
    10% { opacity: 1; }
    88% { opacity: 1; }
    100% { transform: translateY(-151.80px); opacity: 0; }
  }
  @keyframes vitrine-heart-sway-l {
    0%, 100% { transform: translateX(-6px) rotate(-5deg); }
    50% { transform: translateX(6px) rotate(5deg); }
  }
  @keyframes vitrine-heart-sway-r {
    0%, 100% { transform: translateX(6px) rotate(5deg); }
    50% { transform: translateX(-6px) rotate(-5deg); }
  }
  @keyframes vitrine-heart-beat {
    0%, 100% { transform: scale(1); }
    10% { transform: scale(1.22); }
    20% { transform: scale(1); }
    30% { transform: scale(1.15); }
    44% { transform: scale(1); }
  }
  .vitrine-heart-rise-a { animation: vitrine-heart-rise-a 10s linear infinite; }
  .vitrine-heart-rise-b { animation: vitrine-heart-rise-b 10s linear infinite; }
  .vitrine-heart-rise-c { animation: vitrine-heart-rise-c 10s linear infinite; }
  .vitrine-heart-sway-l { animation: vitrine-heart-sway-l 4.2s ease-in-out infinite; }
  .vitrine-heart-sway-r { animation: vitrine-heart-sway-r 4.2s ease-in-out infinite; }
  .vitrine-heart-beat {
    transform-box: fill-box;
    transform-origin: center;
    animation: vitrine-heart-beat 2.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- Single 1.5px neutral Surface1 outer border -->
<rect x="1" y="1" width="838" height="136" rx="12" fill="url(#card-bg)" stroke="#bcc0cc" stroke-width="1.5"/>

