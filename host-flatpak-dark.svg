<svg xmlns="http://www.w3.org/2000/svg" width="198" height="78" viewBox="0 0 198 78" role="img" aria-label="FLATPAK package repository">
<defs>
  <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1e1e2e"/>
    <stop offset="100%" stop-color="#181825"/>
  </linearGradient>
  <linearGradient id="cat-accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#cba6f7"/>
    <stop offset="50%" stop-color="#89b4fa"/>
    <stop offset="100%" stop-color="#94e2d5"/>
  </linearGradient>
  <linearGradient id="cat-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f5c2e7"/>
    <stop offset="25%" stop-color="#cba6f7"/>
    <stop offset="50%" stop-color="#89b4fa"/>
    <stop offset="75%" stop-color="#94e2d5"/>
    <stop offset="100%" stop-color="#a6e3a1"/>
  </linearGradient>
  <linearGradient id="cat-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="32%" stop-color="#cba6f7" stop-opacity="0.14"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.34"/>
    <stop offset="68%" stop-color="#cba6f7" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cat-glint" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
    <stop offset="28%" stop-color="#cba6f7" stop-opacity="0.88"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.96"/>
    <stop offset="72%" stop-color="#94e2d5" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="host-clip">
    <rect x="1.75" y="1.75" width="194.5" height="74.5" rx="9.25"/>
  </clipPath>
</defs>
<style>
  @keyframes vitrine-host-glint {
    0% { transform: translateX(-90px); opacity: 0; }
    10% { opacity: 1; }
    55% { transform: translateX(220px); opacity: 1; }
    66%, 100% { transform: translateX(220px); opacity: 0; }
  }
  .vitrine-host-glint {
    animation: vitrine-host-glint 6.5s ease-in-out 1.80s infinite;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- Single 1.5px Surface1 outer border -->
<rect x="1" y="1" width="196" height="76" rx="10" fill="url(#card-bg)" stroke="#45475a" stroke-width="1.5"/>

<!-- Clipped slim 2.5px Catppuccin top bar with staggered top-edge glint -->
<g clip-path="url(#host-clip)">
  <rect x="0" y="1" width="198" height="3.25" fill="url(#cat-accent)"/>
  <rect x="0" y="1.75" width="76" height="2.5" rx="1.25" fill="url(#cat-glint)" class="vitrine-host-glint"/>
</g>

<!-- Unframed 40x40 host logo -->
<svg x="14" y="20" width="40" height="40" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet"><title>Flatpak</title><style>path{fill:#4A90D9}@media (prefers-color-scheme:dark){path{fill:#4A90D9}}</style><path d="M12 0c-.556 0-1.111.144-1.61.432l-7.603 4.39a3.217 3.217 0 0 0-1.61 2.788v8.78c0 1.151.612 2.212 1.61 2.788l7.603 4.39a3.217 3.217 0 0 0 3.22 0l7.603-4.39a3.217 3.217 0 0 0 1.61-2.788V7.61a3.217 3.217 0 0 0-1.61-2.788L13.61.432A3.218 3.218 0 0 0 12 0Zm0 2.358c.15 0 .299.039.431.115l7.604 4.39c.132.077.24.187.315.316L12 12v9.642a.863.863 0 0 1-.431-.116l-7.604-4.39a.866.866 0 0 1-.431-.746V7.61c0-.153.041-.302.116-.43L12 12Z"/></svg>

<!-- Host name, domain subtitle, and Surface0 package count pill -->
<text x="64" y="27" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.6" fill="#cdd6f4">FLATPAK</text>
<text x="64" y="42" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#6c7086">flatpak.wimpys.world</text>

<g>
  <rect x="64" y="49" width="54" height="19" rx="9.5" fill="#313244"/>
  <text x="91" y="62" text-anchor="middle" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#cba6f7">1 pkg</text>
</g>
</svg>