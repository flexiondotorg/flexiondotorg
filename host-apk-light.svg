<svg xmlns="http://www.w3.org/2000/svg" width="198" height="78" viewBox="0 0 198 78" role="img" aria-label="APK package repository">
<defs>
  <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#eff1f5"/>
    <stop offset="100%" stop-color="#e6e9ef"/>
  </linearGradient>
  <linearGradient id="cat-accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="100%" stop-color="#179299"/>
  </linearGradient>
  <linearGradient id="cat-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ea76cb"/>
    <stop offset="25%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="75%" stop-color="#179299"/>
    <stop offset="100%" stop-color="#40a02b"/>
  </linearGradient>
  <linearGradient id="cat-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="32%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65"/>
    <stop offset="68%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cat-glint" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef" stop-opacity="0"/>
    <stop offset="28%" stop-color="#8839ef" stop-opacity="0.88"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.96"/>
    <stop offset="72%" stop-color="#179299" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#179299" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="host-clip">
    <rect x="1.75" y="1.75" width="194.5" height="74.5" rx="9.25"/>
  </clipPath>
</defs>
<style>
  @keyframes vitrine-host-glint {
    0% { transform: translateX(-90px); opacity: 0; }
    10% { opacity: 1; }
    55% { transform: translateX(220px); opacity: 1; }
    66%, 100% { transform: translateX(220px); opacity: 0; }
  }
  .vitrine-host-glint {
    animation: vitrine-host-glint 6.5s ease-in-out 1.35s infinite;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- Single 1.5px Surface1 outer border -->
<rect x="1" y="1" width="196" height="76" rx="10" fill="url(#card-bg)" stroke="#bcc0cc" stroke-width="1.5"/>

<!-- Clipped slim 2.5px Catppuccin top bar with staggered top-edge glint -->
<g clip-path="url(#host-clip)">
  <rect x="0" y="1" width="198" height="3.25" fill="url(#cat-accent)"/>
  <rect x="0" y="1.75" width="76" height="2.5" rx="1.25" fill="url(#cat-glint)" class="vitrine-host-glint"/>
</g>

<!-- Unframed 40x40 host logo -->
<svg x="14" y="20" width="40" height="40" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet"><title>Alpine Linux</title><style>path{fill:#0D597F}@media (prefers-color-scheme:dark){path{fill:#7FC0E3}}</style><path d="M5.998 1.607L0 12l5.998 10.393h12.004L24 12 18.002 1.607H5.998zM9.965 7.12L12.66 9.9l1.598 1.595.002-.002 2.41 2.363c-.2.14-.386.252-.563.344a3.756 3.756 0 01-.496.217 2.702 2.702 0 01-.425.111c-.131.023-.25.034-.358.034-.13 0-.242-.014-.338-.034a1.317 1.317 0 01-.24-.072.95.95 0 01-.2-.113l-1.062-1.092-3.039-3.041-1.1 1.053-3.07 3.072a.974.974 0 01-.2.111 1.274 1.274 0 01-.237.073c-.096.02-.209.033-.338.033-.108 0-.227-.009-.358-.031a2.7 2.7 0 01-.425-.114 3.748 3.748 0 01-.496-.217 5.228 5.228 0 01-.563-.343l6.803-6.727zm4.72.785l4.579 4.598 1.382 1.353a5.24 5.24 0 01-.564.344 3.73 3.73 0 01-.494.217 2.697 2.697 0 01-.426.111c-.13.023-.251.034-.36.034-.129 0-.241-.014-.337-.034a1.285 1.285 0 01-.385-.146c-.033-.02-.05-.036-.053-.04l-1.232-1.218-2.111-2.111-.334.334L12.79 9.8l1.896-1.897zm-5.966 4.12v2.529a2.128 2.128 0 01-.356-.035 2.765 2.765 0 01-.422-.116 3.708 3.708 0 01-.488-.214 5.217 5.217 0 01-.555-.34l1.82-1.825Z"/></svg>

<!-- Host name, domain subtitle, and Surface0 package count pill -->
<text x="64" y="27" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.6" fill="#4c4f69">APK</text>
<text x="64" y="42" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#9ca0b0">apk.wimpys.world</text>

<g>
  <rect x="64" y="49" width="54" height="19" rx="9.5" fill="#ccd0da"/>
  <text x="91" y="62" text-anchor="middle" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#8839ef">6 pkgs</text>
</g>
</svg>