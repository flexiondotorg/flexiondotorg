<style>
  @keyframes vitrine-icon-breathe {
    0%, 100% { opacity: 0.82; }
    50% { opacity: 1; }
  }
  .vitrine-pill-icon {
    animation: vitrine-icon-breathe 4.4s ease-in-out 0s infinite;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

