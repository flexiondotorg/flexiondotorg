profile:
  name: "Martin Wimpress"
  handle: "flexiondotorg"
  eyebrow: ""
  hero_title: "WIMPY'S WORLD"
  hero_subtitle: "Linux, Quickemu, Linux Matters & Open-Source Craft"
  hero_url: "https://wimpys.world"
  hero_cta: "wimpys.world"
  bio: >-
    Hello! I am Martin (also known as Wimpy), a Linux user, open-source developer, and community builder behind [Quickemu](https://github.com/quickemu-project/quickemu), the [Linux Matters](https://linuxmatters.sh) podcast, and [Wimpy's World](https://wimpys.world). I also tinker with indie games at [Oval Tutu](https://oval-tutu.com).
  links:
    - label: "Mastodon"
      slug: "mastodon"
      url: "https://wimpysworld.social/@martin"
      icon: "mastodon"
    - label: "Bluesky"
      slug: "bluesky"
      url: "https://bsky.app/profile/wimpys.world"
      icon: "bluesky"
    - label: "LinkedIn"
      slug: "linkedin"
      url: "https://www.linkedin.com/in/martinwimpress/"
      icon: "linkedin"

discord:
  enabled: true
  name: "Wimpy's World Discord"
  tagline: "Friendly Linux and open-source community hub"
  url: "https://wimpysworld.io/discord"
  invite_code: "vUsydfP"
  guild_id: "712850672223125565"

theme:
  dark_preset: catppuccin-mocha
  light_preset: catppuccin-latte

github:
  username: "flexiondotorg"
  orgs:
    - "wimpysworld"
    - "quickemu-project"
    - "ubuntu-mate"
    - "linuxmatters"
  exclude_owners:
    - "flexiondotorg"
    - "wimpysworld"
    - "linuxmatters"
    - "quickemu-project"
    - "ubuntu-mate"
    - "Oval-Tutu"
  max_items: 5
  contributions_window_days: 365
  sponsors_url: "https://github.com/sponsors/flexiondotorg"
