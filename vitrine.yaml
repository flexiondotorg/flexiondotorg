  config_url: "https://raw.githubusercontent.com/wimpysworld/haberdasher/main/haberdasher.yaml"
  hosts:
    - "apt.wimpys.world"
    - "rpm.wimpys.world"
    - "pkg.wimpys.world"
    - "apk.wimpys.world"
    - "flatpak.wimpys.world"
    - "brew.wimpys.world"
    - "scoop.wimpys.world"
    - "nix.wimpys.world"
  png_fallbacks:
    wimpysworld/ia-get: "assets/ia-get.png"

feeds:
