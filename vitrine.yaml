profile:
  name: "Martin Wimpress"
  handle: "flexiondotorg"
  eyebrow: "Welcome!"
  hero_title: "MARTIN WIMPRESS"
  hero_subtitle: "Linux enthusiast. Nix wrangler. Podcaster. Occasional developer."
  hero_url: "https://wimpys.world"
  hero_cta: "wimpys.world"
  bio: >-
    Hello! I am Martin (also known as Wimpy), a long-time Linux user, open-source developer, and community builder. I am a co-presenter of the [Linux Matters](https://linuxmatters.sh) podcast, a hobbyist game developer at [Oval Tutu](https://oval-tutu.com), and a [Chainguardian](https://chainguard.dev).

    I used to be the lead developer of [Ubuntu MATE](https://ubuntu-mate.org), but these days I prefer to make applications and games in my spare time. Below you will find links to some of my current projects, my first-party package repositories, and the podcast.
  links:
    - label: "Mastodon"
      slug: "mastodon"
      url: "https://wimpysworld.social/@martin"
      icon: "mastodon"
    - label: "Bluesky"
      slug: "bluesky"
      url: "https://bsky.app/profile/wimpys.world"
      icon: "bluesky"
    - label: "LinkedIn"
      slug: "linkedin"
      url: "https://www.linkedin.com/in/martinwimpress/"
      icon: "linkedin"

discord:
  enabled: true
  name: "Wimpy's World Discord"
  tagline: "Friendly Linux and open-source community hub"
  url: "https://wimpysworld.io/discord"
  invite_code: "vUsydfP"
  guild_id: "712850672223125565"

theme:
  dark_preset: catppuccin-mocha
  light_preset: catppuccin-latte

github:
  username: "flexiondotorg"
  orgs:
    - "linuxmatters"
    - "noughtylinux"
    - "Oval-Tutu"
    - "quickemu-project"
    - "ubuntu-mate"
    - "wimpysworld"
  exclude_owners:
    - "flexiondotorg"
    - "linuxmatters"
    - "noughtylinux"
    - "Oval-Tutu"
    - "quickemu-project"
    - "ubuntu-mate"
    - "wimpysworld"
  max_items: 5
  contributions_window_days: 365
  sponsors_url: "https://github.com/sponsors/flexiondotorg"
  sponsors_fallback: []

haberdasher:
  enabled: true
  config_url: "https://raw.githubusercontent.com/wimpysworld/haberdasher/main/haberdasher.yaml"
  sort: stars
  hosts:
    - "apt.wimpys.world"
    - "rpm.wimpys.world"
    - "pkg.wimpys.world"
    - "apk.wimpys.world"
    - "flatpak.wimpys.world"
    - "brew.wimpys.world"
    - "scoop.wimpys.world"
    - "nix.wimpys.world"
  png_fallbacks:
    wimpysworld/ia-get: "assets/ia-get.png"

projects:
  - repo: wimpysworld/deb-get
