<svg xmlns="http://www.w3.org/2000/svg" width="408" height="182" viewBox="0 0 408 182" role="img" aria-label="Glyph Party">
<defs>
  <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#eff1f5"/>
    <stop offset="100%" stop-color="#e6e9ef"/>
  </linearGradient>
  <linearGradient id="cat-accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="100%" stop-color="#179299"/>
  </linearGradient>
  <linearGradient id="cat-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ea76cb"/>
    <stop offset="25%" stop-color="#8839ef"/>
    <stop offset="50%" stop-color="#1e66f5"/>
    <stop offset="75%" stop-color="#179299"/>
    <stop offset="100%" stop-color="#40a02b"/>
  </linearGradient>
  <linearGradient id="cat-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="32%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65"/>
    <stop offset="68%" stop-color="#8839ef" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cat-glint" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8839ef" stop-opacity="0"/>
    <stop offset="28%" stop-color="#8839ef" stop-opacity="0.88"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.96"/>
    <stop offset="72%" stop-color="#179299" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#179299" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card-clip">
    <rect x="1.75" y="1.75" width="404.5" height="178.5" rx="11.25"/>
  </clipPath>
</defs>
<style>
  @keyframes vitrine-fresh-pulse {
    0% { transform: scale(1); opacity: 0.85; }
    75% { transform: scale(2.2); opacity: 0; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  @keyframes vitrine-wave {
    0%, 100% { transform: scaleY(0.45); opacity: 0.72; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  @keyframes vitrine-card-glint {
    0% { transform: translateX(-140px); opacity: 0; }
    10% { opacity: 1; }
    55% { transform: translateX(430px); opacity: 1; }
    66%, 100% { transform: translateX(430px); opacity: 0; }
  }
  .vitrine-fresh-ring {
    transform-box: fill-box;
    transform-origin: center;
    animation: vitrine-fresh-pulse 2.2s ease-out infinite;
  }
  .vitrine-wave-bar {
    transform-box: fill-box;
    transform-origin: center;
    animation: vitrine-wave 1.8s ease-in-out infinite;
  }
  .vitrine-card-glint {
    animation: vitrine-card-glint 6.5s ease-in-out 5.50s infinite;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- Single 1.5px Surface1 outer border -->
<rect x="1" y="1" width="406" height="180" rx="12" fill="url(#card-bg)" stroke="#bcc0cc" stroke-width="1.5"/>

<!-- Clipped slim 2.5px Catppuccin top bar with staggered top-edge glint -->
<g clip-path="url(#card-clip)">
  <rect x="0" y="1" width="408" height="3.25" fill="url(#cat-accent)"/>
  <rect x="0" y="1.75" width="120" height="2.5" rx="1.25" fill="url(#cat-glint)" class="vitrine-card-glint"/>
</g>

<!-- Unframed 64x64 project logo -->
<svg x="20" y="34" width="64" height="64" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet"><title id="vlogo-d96c9540-glyph-party-title">Glyph Party</title><defs><linearGradient id="vlogo-d96c9540-gp-violet" x1="8" y1="8" x2="27" y2="27" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#9e70e8"/><stop offset="100%" stop-color="#804cd1"/></linearGradient><linearGradient id="vlogo-d96c9540-gp-pink" x1="56" y1="8" x2="37" y2="27" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f7529b"/><stop offset="100%" stop-color="#db2e7c"/></linearGradient><linearGradient id="vlogo-d96c9540-gp-gold" x1="56" y1="56" x2="37" y2="37" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffc045"/><stop offset="100%" stop-color="#ed931c"/></linearGradient><linearGradient id="vlogo-d96c9540-gp-mint" x1="8" y1="56" x2="27" y2="37" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#29e0a2"/><stop offset="100%" stop-color="#10bd84"/></linearGradient></defs><rect x="23" y="23" width="18" height="18" rx="2" fill="#2b124d"/><g id="vlogo-d96c9540-gp-outline" fill="none" stroke="#210e3b" stroke-width="8.8" stroke-linecap="round" stroke-linejoin="round"><path d="M32 22.2H14.8A7.4 7.4 0 1 1 22.2 14.8V32"/><path d="M41.8 32V14.8A7.4 7.4 0 1 1 49.2 22.2H32"/><path d="M32 41.8H49.2A7.4 7.4 0 1 1 41.8 49.2V32"/><path d="M22.2 32V49.2A7.4 7.4 0 1 1 14.8 41.8H32"/></g><g id="vlogo-d96c9540-gp-ribbons" fill="none" stroke-width="6.2" stroke-linecap="butt" stroke-linejoin="round"><path d="M32 22.2H14.8A7.4 7.4 0 1 1 22.2 14.8V32" stroke="url(#vlogo-d96c9540-gp-violet)"/><path d="M41.8 32V14.8A7.4 7.4 0 1 1 49.2 22.2H32" stroke="url(#vlogo-d96c9540-gp-pink)"/><path d="M32 41.8H49.2A7.4 7.4 0 1 1 41.8 49.2V32" stroke="url(#vlogo-d96c9540-gp-gold)"/><path d="M22.2 32V49.2A7.4 7.4 0 1 1 14.8 41.8H32" stroke="url(#vlogo-d96c9540-gp-mint)"/></g><g id="vlogo-d96c9540-gp-weave" fill="none" stroke-linecap="butt"><path d="M22.2 17.5V26.9" stroke="#210e3b" stroke-width="8.8"/><path d="M22.2 16.5V27.9" stroke="url(#vlogo-d96c9540-gp-violet)" stroke-width="6.2"/><path d="M46.5 22.2H37.1" stroke="#210e3b" stroke-width="8.8"/><path d="M47.5 22.2H36.1" stroke="url(#vlogo-d96c9540-gp-pink)" stroke-width="6.2"/><path d="M41.8 46.5V37.1" stroke="#210e3b" stroke-width="8.8"/><path d="M41.8 47.5V36.1" stroke="url(#vlogo-d96c9540-gp-gold)" stroke-width="6.2"/><path d="M17.5 41.8H26.9" stroke="#210e3b" stroke-width="8.8"/><path d="M16.5 41.8H27.9" stroke="url(#vlogo-d96c9540-gp-mint)" stroke-width="6.2"/></g><path d="M32 25.6 Q32.9 31.1 38.4 32 Q32.9 32.9 32 38.4 Q31.1 32.9 25.6 32 Q31.1 31.1 32 25.6 Z" fill="#ffffff"/></svg>

<!-- Top-right release version pill -->
<g>
  <rect x="317" y="22" width="71" height="22" rx="11" fill="#ccd0da" stroke="#40a02b" stroke-width="1"/>
  <circle cx="329" cy="33" r="3.4" fill="#40a02b" opacity="0.45" class="vitrine-fresh-ring"/>
  <circle cx="329" cy="33" r="3.1" fill="#40a02b"/>
  <text x="338" y="36.5" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#4c4f69">v0.2.1</text>
</g>

<!-- Project title and wrapped 4-line description -->
<text x="100" y="42" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.2" fill="#4c4f69">Glyph Party</text>
<text x="100" y="68" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">Finally, a Unicode search tool that sparks</text><text x="100" y="86" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">joy instead of despair. 10,000+ characters,</text><text x="100" y="104" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c6f85">zero tears 😂</text>

<!-- Clean 1px Surface0 footer separator -->
<line x1="20" y1="142" x2="388" y2="142" stroke="#ccd0da" stroke-width="1"/>

<!-- Clean 3-part footer: language, stars, release age -->
<g>
  <circle cx="24" cy="159" r="4" fill="#f1e05a"/><text x="35" y="163" font-family="'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4c4f69">JavaScript</text>
  <text x="204" y="163" text-anchor="middle" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#4c4f69"><tspan fill="#df8e1d">★</tspan> 15</text>
  <text x="388" y="163" text-anchor="end" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#9ca0b0">2d ago</text>
</g>
</svg>