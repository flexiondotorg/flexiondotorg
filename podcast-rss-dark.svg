    animation: vitrine-icon-breathe 4.4s ease-in-out 1.35s infinite;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- Single 1.5px platform-accent outer border -->
<rect x="1" y="1" width="166" height="42" rx="10" fill="url(#card-bg)" stroke="#fab387" stroke-width="1.5"/>

